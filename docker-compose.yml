services:
  db:
    image: postgis/postgis:15-3.4
    container_name: solar_wind_db
    environment:
      POSTGRES_DB: renewable_energy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d renewable_energy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: solar_wind_backend
    environment:
      APP_NAME: Solar & Wind Deployment Intelligence Platform
      APP_VERSION: "1.0.0"
      SECRET_KEY: change-this-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      DATABASE_URL: postgresql://postgres:postgres@db:5432/renewable_energy
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: solar_wind_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: